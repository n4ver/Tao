[package]
name = "tao"
version = "0.1.0"
edition = "2024"
description = "Sorts the Windows Downloads folder into category folders, fully locally"
default-run = "tao"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
globset = "0.4.21"
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

[profile.release]
# Small binaries: whole-program optimisation, optimise for size, no symbols.
# The watcher spends its life asleep, so size matters more than speed.
lto = true
codegen-units = 1
strip = true
opt-level = "s"
