name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $name = "tao"
          $tag = "${{ github.ref_name }}"
          $dir = "$name-$tag-windows-x64"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item "target/release/$name.exe" $dir
          Copy-Item README.md $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          (Get-FileHash "$dir.zip" -Algorithm SHA256).Hash.ToLower() + "  $dir.zip" | Out-File "$dir.zip.sha256" -Encoding ascii
          "ASSET=$dir.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append