name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # The full CI suite (fmt, clippy, tests on Windows and Ubuntu, MSRV,
  # cargo deny). Nothing is published unless all of it passes.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches Cargo.toml version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
            exit 1
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Package
        id: package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $dir = "tao-$tag-windows-x64"
          New-Item -ItemType Directory -Path $dir | Out-Null
          # Both executables: tao.exe (CLI) and taow.exe (tray / background watcher).
          # They must stay in the same folder for `tao install` to work.
          Copy-Item target/release/tao.exe, target/release/taow.exe, README.md, LICENSE, CHANGELOG.md $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          (Get-FileHash "$dir.zip" -Algorithm SHA256).Hash.ToLower() + "  $dir.zip" | Out-File "$dir.zip.sha256" -Encoding ascii
          "asset=$dir.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
          generate_release_notes: true
